name: Build MediaTok Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gradle Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
          key: native-${{ github.job }}
          max-size: 5G

      - name: Install NDK and Configure Properties
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018"
            echo "KEYSTORE_PASS=android"
            echo "ALIAS_NAME=androidkey"
            echo "ALIAS_PASS=android"
            echo "TELEGRAM_APP_ID=4"
            echo "TELEGRAM_APP_HASH=014b35b6184100b085b0d0572f9b5103"
          } > local.properties
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          if ! keytool -list -keystore TMessagesProj/release.keystore -storepass android -alias androidkey >/dev/null 2>&1; then
            rm -f TMessagesProj/release.keystore
            keytool -genkeypair -v -keystore TMessagesProj/release.keystore \
              -alias androidkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MediaTok, OU=Mobile, O=MediaTok, L=Internet, S=Net, C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Release APKs
        run: |
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache
          mkdir -p dist
          ARM64_APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          ARMV7_APK=$(find TMessagesProj/build/outputs/apk -name '*armeabi-v7a*.apk' | head -n 1)
          [ -n "$ARM64_APK" ] && cp "$ARM64_APK" dist/MediaTok-arm64-v8a.apk
          [ -n "$ARMV7_APK" ] && cp "$ARMV7_APK" dist/MediaTok-armeabi-v7a.apk
          ls -lh dist

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaTok-Android-APK-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes || true
          gh release create "$TAG" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "MediaTok Android Build #${{ github.run_number }}" \
            --notes "MediaTok Android signed APK (arm64-v8a for modern phones, armeabi-v7a for older 32-bit devices). Commands: .mt, .ai, .tldr, .tr, .fix, .tone, .autodel, .delme, .wipe."
